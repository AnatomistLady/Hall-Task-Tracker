<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Sacred Oak & Fuzzy Bee Task Sanctuary</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Quicksand:wght@400;600;700&display=swap');
    body {
      font-family: 'Quicksand', sans-serif;
      background: #0d1b1e;
      color: #e2f1af;
    }
    h1, h2, .serif-font {
      font-family: 'Cinzel', serif;
    }
   .tree-hero-container {
  position: relative;
  background-image: url('tree.jpg');
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  background-color: #0d1b1e; /* matches your page background behind the image */
  border-radius: 1.5rem;
  overflow: hidden;
  min-height: 600px; /* increased height so the full vertical aspect ratio displays nicely */
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
}
    .water-ripple {
      position: absolute;
      bottom: 10px;
      left: 10%;
      right: 10%;
      height: 30px;
      background: radial-gradient(ellipse at center, rgba(165, 243, 252, 0.25) 0%, rgba(255, 255, 255, 0) 70%);
      animation: pulseRipple 4s infinite ease-in-out;
      pointer-events: none;
    }
    @keyframes pulseRipple {
      0%, 100% { opacity: 0.3; transform: scaleX(1); }
      50% { opacity: 0.7; transform: scaleX(1.1); }
    }
    .pollen-particle {
      position: absolute;
      background: rgba(253, 224, 71, 0.8);
      border-radius: 50%;
      filter: blur(1px);
      animation: floatPollen linear infinite;
    }
    @keyframes floatPollen {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(-120px) translateX(30px); opacity: 0; }
    }
    .bee-mascot {
      animation: floatBee 3s ease-in-out infinite;
    }
    @keyframes floatBee {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }
    .flying-nectar-bee {
      position: fixed;
      width: 45px;
      height: 45px;
      z-index: 50;
      pointer-events: none;
      transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1);
    }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Top Bar -->
    <header class="flex flex-col md:flex-row items-center justify-between bg-emerald-950/60 backdrop-blur-md p-4 rounded-2xl border border-emerald-500/30">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🐝</span>
        <div>
          <h1 class="text-2xl font-bold text-amber-200">The Sacred Oak Sanctuary</h1>
          <p class="text-xs text-emerald-300">ADHD-Friendly Daily Task Garden</p>
        </div>
      </div>
      
      <!-- Progress Nectar Bar -->
      <div class="flex items-center gap-4 mt-3 md:mt-0">
        <div class="text-right">
          <div class="text-xs text-amber-300 font-semibold">Honey Jar Level</div>
          <div id="progressPercent" class="text-lg font-bold text-amber-400">0%</div>
        </div>
        <div class="w-36 h-5 bg-emerald-900/80 rounded-full overflow-hidden border border-amber-500/40 p-0.5">
          <div id="progressBar" class="h-full bg-gradient-to-r from-amber-500 to-yellow-300 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>
    </header>

    <!-- Main Hero Tree Canvas Card -->
    <div class="tree-hero-container flex flex-col justify-between p-6 border-2 border-amber-500/30">
      
      <!-- Particle & Blossom SVG Overlay -->
      <div id="pollenOverlay" class="absolute inset-0 pointer-events-none"></div>
      <svg class="absolute inset-0 w-full h-full pointer-events-none" id="treeSvgOverlay">
        <g id="treeBlossomLayer"></g>
      </svg>
      <div class="water-ripple"></div>

      <!-- Header Prompt Overlay -->
      <div class="relative z-10 flex justify-between items-start">
        <div class="bg-slate-950/70 backdrop-blur-md p-4 rounded-xl border border-amber-400/30 max-w-sm">
          <div class="flex items-center gap-2 mb-1">
            <span class="bee-mascot text-2xl">🐝</span>
            <span class="font-bold text-amber-300 text-sm">Barnaby says:</span>
          </div>
          <p id="beePrompt" class="text-xs text-emerald-100 italic">"Small steps bring sweet nectar! Which quick goal shall we conquer first today?"</p>
        </div>

        <!-- Focus Timer Toggle Button -->
        <button onclick="toggleTimerModal()" class="bg-amber-600/80 hover:bg-amber-500 text-amber-950 font-bold px-4 py-2 rounded-xl border border-amber-300/50 shadow-lg backdrop-blur-sm transition-all flex items-center gap-2 text-sm">
          <span>⏱️</span>
          <span>Forest Focus Timer</span>
        </button>
      </div>

      <!-- Quick Add Task Bar -->
      <div class="relative z-10 bg-slate-950/80 backdrop-blur-md p-4 rounded-2xl border border-emerald-500/40 mt-auto">
        <form id="taskForm" onsubmit="addTask(event)" class="flex flex-col md:flex-row gap-3">
          <input type="text" id="taskTitle" placeholder="Enter a task (e.g. Grade assignments, prep lesson plan)..." required class="flex-1 bg-emerald-950/80 border border-emerald-600/50 rounded-xl px-4 py-2.5 text-emerald-100 placeholder-emerald-400/60 focus:outline-none focus:border-amber-400 text-sm">
          
          <select id="taskCategory" class="bg-emerald-950/80 border border-emerald-600/50 rounded-xl px-3 py-2.5 text-emerald-100 text-sm focus:outline-none focus:border-amber-400">
            <option value="Teaching">📚 Teaching</option>
            <option value="Personal">🏡 Personal</option>
          </select>

          <input type="date" id="taskDeadline" class="bg-emerald-950/80 border border-emerald-600/50 rounded-xl px-3 py-2.5 text-emerald-100 text-sm focus:outline-none focus:border-amber-400">

          <button type="submit" class="bg-gradient-to-r from-amber-500 to-yellow-400 hover:from-amber-400 hover:to-yellow-300 text-amber-950 font-bold px-6 py-2.5 rounded-xl shadow-md transition-all text-sm">
            + Plant Task
          </button>
        </form>
      </div>
    </div>

    <!-- Task List Section -->
    <main class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Teaching Tasks Column -->
      <section class="bg-emerald-950/50 backdrop-blur-md p-5 rounded-2xl border border-emerald-600/30">
        <h2 class="text-lg font-bold text-amber-300 mb-4 flex items-center gap-2">
          <span>📚</span> Teaching Tasks
        </h2>
        <div id="teachingTaskList" class="space-y-3"></div>
      </section>

      <!-- Personal Tasks Column -->
      <section class="bg-emerald-950/50 backdrop-blur-md p-5 rounded-2xl border border-emerald-600/30">
        <h2 class="text-lg font-bold text-amber-300 mb-4 flex items-center gap-2">
          <span>🏡</span> Personal Tasks
        </h2>
        <div id="personalTaskList" class="space-y-3"></div>
      </section>

    </main>
  </div>

  <!-- Focus Timer Modal -->
  <div id="timerModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-emerald-950 border-2 border-amber-400/50 rounded-2xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl">
      <h3 class="text-xl font-bold text-amber-300 serif-font">Forest Focus Timer</h3>
      <div id="timerDisplay" class="text-5xl font-mono font-bold text-emerald-100">25:00</div>
      <div class="flex justify-center gap-3">
        <button onclick="startTimer()" class="bg-amber-500 text-amber-950 font-bold px-4 py-2 rounded-xl">Start</button>
        <button onclick="pauseTimer()" class="bg-emerald-800 text-emerald-100 font-bold px-4 py-2 rounded-xl">Pause</button>
        <button onclick="resetTimer()" class="bg-emerald-900 text-emerald-300 font-bold px-4 py-2 rounded-xl">Reset</button>
      </div>
      <button onclick="toggleTimerModal()" class="text-xs text-emerald-400 underline">Close</button>
    </div>
  </div>

  <script>
    let tasks = [];
    let timerInterval = null;
    let timerSeconds = 25 * 60;

    function initPollen() {
      const container = document.getElementById('pollenOverlay');
      for (let i = 0; i < 20; i++) {
        const pollen = document.createElement('div');
        pollen.className = 'pollen-particle';
        pollen.style.width = `${Math.random() * 4 + 2}px`;
        pollen.style.height = pollen.style.width;
        pollen.style.left = `${Math.random() * 100}%`;
        pollen.style.top = `${Math.random() * 80 + 10}%`;
        pollen.style.animationDuration = `${Math.random() * 5 + 4}s`;
        pollen.style.animationDelay = `${Math.random() * 3}s`;
        container.appendChild(pollen);
      }
    }

    function addTask(e) {
      e.preventDefault();
      const title = document.getElementById('taskTitle').value;
      const category = document.getElementById('taskCategory').value;
      const deadline = document.getElementById('taskDeadline').value;

      tasks.push({ id: Date.now(), title, category, deadline, completed: false });
      document.getElementById('taskTitle').value = '';
      renderTasks();
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        if (task.completed) spawnNectarBee();
        renderTasks();
        updateSanctuaryProgress();
      }
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      renderTasks();
      updateSanctuaryProgress();
    }

    function renderTasks() {
      const teachingList = document.getElementById('teachingTaskList');
      const personalList = document.getElementById('personalTaskList');
      
      teachingList.innerHTML = '';
      personalList.innerHTML = '';

      tasks.forEach(task => {
        const card = document.createElement('div');
        card.className = `p-3.5 rounded-xl border flex items-center justify-between transition-all ${
          task.completed ? 'bg-emerald-950/30 border-emerald-800/40 opacity-60' : 'bg-emerald-900/60 border-emerald-500/40 shadow-sm'
        }`;

        card.innerHTML = `
          <div class="flex items-center gap-3">
            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})" class="w-5 h-5 accent-amber-400 rounded cursor-pointer">
            <div>
              <span class="${task.completed ? 'line-through text-emerald-400' : 'text-emerald-100'} font-medium text-sm">${task.title}</span>
              ${task.deadline ? `<div class="text-[11px] text-amber-300/80">🗓️ Due: ${task.deadline}</div>` : ''}
            </div>
          </div>
          <button onclick="deleteTask(${task.id})" class="text-xs text-red-400/70 hover:text-red-300 p-1">✕</button>
        `;

        if (task.category === 'Teaching') {
          teachingList.appendChild(card);
        } else {
          personalList.appendChild(card);
        }
      });
    }

    function updateSanctuaryProgress() {
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const percent = total > 0 ? Math.round((completed / total) * 100) : 0;

      document.getElementById('progressBar').style.width = `${percent}%`;
      document.getElementById('progressPercent').innerText = `${percent}%`;

      const blossomGroup = document.getElementById('treeBlossomLayer');
      if (!blossomGroup) return;
      blossomGroup.innerHTML = '';

      for (let i = 0; i < completed; i++) {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', 100 + (i * 35) % 300);
        circle.setAttribute('cy', 80 + (i * 20) % 150);
        circle.setAttribute('r', '7');
        circle.setAttribute('fill', '#fde047');
        circle.setAttribute('filter', 'drop-shadow(0px 0px 4px #eab308)');
        blossomGroup.appendChild(circle);
      }
    }

    function spawnNectarBee() {
      const bee = document.createElement('div');
      bee.className = 'flying-nectar-bee';
      bee.innerText = '🐝';
      bee.style.left = '50%';
      bee.style.bottom = '10%';
      document.body.appendChild(bee);

      setTimeout(() => {
        bee.style.transform = 'translate(-150px, -350px) scale(1.3)';
        bee.style.opacity = '0';
      }, 50);

      setTimeout(() => bee.remove(), 1300);
    }

    function toggleTimerModal() {
      document.getElementById('timerModal').classList.toggle('hidden');
    }

    function startTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        if (timerSeconds > 0) {
          timerSeconds--;
          updateTimerDisplay();
        } else {
          pauseTimer();
          alert('Focus session complete! Time for a honey break!');
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function resetTimer() {
      pauseTimer();
      timerSeconds = 25 * 60;
      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
      const secs = (timerSeconds % 60).toString().padStart(2, '0');
      document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
    }

    initPollen();
  </script>
</body>
</html>
